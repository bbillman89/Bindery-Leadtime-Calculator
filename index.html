<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preproduction — Select Role</title>
  <script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --gold:      #C9A12C;
      --gold-dark: #9C7A18;
      --ink:       #262626;
      --p2-bg:     #eafaf1;
      --p2-label:  #1a6b3c;
      --p2-band:   #b7e4c7;
      --p1-bg:     #f0f0f0;
      --p1-label:  #555;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #e9e7e0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,.14);
      width: 460px;
      overflow: hidden;
    }

    .card-header {
      background: var(--gold);
      padding: 28px 32px 20px;
      color: #fff;
    }
    .card-header h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .card-header p {
      margin: 0;
      font-size: 11px;
      opacity: .8;
      letter-spacing: .03em;
    }

    .card-body { padding: 28px 32px 32px; }

    .card-body h2 {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #888;
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    .role-btn {
      border: 2px solid #e0e0e0;
      background: #fff;
      border-radius: 8px;
      padding: 20px 16px;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s, box-shadow .15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .role-btn:hover {
      border-color: var(--gold);
      box-shadow: 0 2px 8px rgba(201,161,44,.2);
    }
    .role-btn.active-role {
      border-color: var(--gold);
      background: #fffce8;
      box-shadow: 0 2px 8px rgba(201,161,44,.25);
    }
    .role-btn.active-role.coord {
      border-color: var(--p2-label);
      background: var(--p2-bg);
      box-shadow: 0 2px 8px rgba(26,107,60,.2);
    }

    .role-icon { font-size: 22px; line-height: 1; }
    .role-name {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .role-desc {
      font-size: 10px;
      color: #888;
      line-height: 1.4;
    }

    .proceed-btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: var(--gold);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: filter .15s;
    }
    .proceed-btn:hover { filter: brightness(.92); }
    .proceed-btn:disabled { background: #ccc; cursor: default; filter: none; }
    .proceed-btn.coord-go { background: var(--p2-label); }

    .current-role-note {
      font-size: 10px;
      color: #aaa;
      text-align: center;
      margin-top: 14px;
    }
    .current-role-note strong { color: #666; }

    .switch-note {
      font-size: 10px;
      color: #bbb;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Preproduction Materials List</h1>
      <p>Select your role to continue. Your choice is saved to this browser.</p>
    </div>
    <div class="card-body">
      <h2>Who are you?</h2>
      <div class="role-grid">
        <button class="role-btn" id="btn-planner" onclick="selectRole('planner')">
          <span class="role-icon"><i class="fa-solid fa-clipboard-list"></i></span>
          <span class="role-name">Planner</span>
          <span class="role-desc">Fill in job specs, materials, and departments. Export the planned PDF.</span>
        </button>
        <button class="role-btn coord" id="btn-coordinator" onclick="selectRole('coordinator')">
          <span class="role-icon"><i class="fa-solid fa-circle-check"></i></span>
          <span class="role-name">Coordinator</span>
          <span class="role-desc">Review availability, track arrivals, and authorize for production.</span>
        </button>
      </div>

      <button class="proceed-btn" id="proceed-btn" disabled onclick="proceed()">
        Select a role to continue
      </button>

      <p class="current-role-note" id="role-note" style="display:none;">
        Your saved role: <strong id="saved-role-label"></strong> — select a different role above to switch.
      </p>
      <p class="switch-note">Each machine should use one role. Your selection persists across sessions.</p>
    </div>
  </div>

  <script>
    var selectedRole = null;

    /* Load saved role on page open */
    (function init() {
      var saved = localStorage.getItem('pp_role');
      if (saved) {
        selectedRole = saved;
        highlight(saved);
        updateProceedBtn(saved);
        document.getElementById('role-note').style.display = '';
        document.getElementById('saved-role-label').textContent = saved === 'planner' ? 'Planner' : 'Coordinator';
      }
    })();

    function selectRole(role) {
      selectedRole = role;
      highlight(role);
      updateProceedBtn(role);
    }

    function highlight(role) {
      document.getElementById('btn-planner').classList.toggle('active-role', role === 'planner');
      document.getElementById('btn-coordinator').classList.toggle('active-role', role === 'coordinator');
    }

    function updateProceedBtn(role) {
      var btn = document.getElementById('proceed-btn');
      btn.disabled = false;
      if (role === 'planner') {
        btn.innerHTML = 'Open Planner View <i class="fa-solid fa-chevron-right"></i>';
        btn.className = 'proceed-btn';
      } else {
        btn.innerHTML = 'Open Coordinator View <i class="fa-solid fa-chevron-right"></i>';
        btn.className = 'proceed-btn coord-go';
      }
    }

    function proceed() {
      if (!selectedRole) return;
      localStorage.setItem('pp_role', selectedRole);
      window.location.href = selectedRole === 'planner' ? 'planner.html' : 'coordinator.html';
    }
  </script>
</body>
</html>
